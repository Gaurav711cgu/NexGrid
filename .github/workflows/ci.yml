name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality (Ruff & Bandit & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint & typecheck dependencies
        run: |
          pip install -r backend/requirements.dev.txt
      - name: Ruff lint check
        run: ruff check backend/app --output-format=github
      - name: Security scan (Bandit)
        run: bandit -r backend/app -ll -x backend/app/core/redis.py
      - name: Static type check (Mypy)
        run: mypy backend/app --ignore-missing-imports

  security-deps:
    name: Dependency CVE Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and Build Frontend
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build

  test:
    name: Test Suite (Pytest & Coverage)
    runs-on: ubuntu-latest
    needs: [quality, security-deps]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexagrid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev requirements
        run: pip install -r backend/requirements.dev.txt
      - name: Init DB schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nexagrid_test -f backend/schema.sql
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexagrid_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-key-super-secure-2026-min-32-chars
          ENVIRONMENT: development
          ANTHROPIC_API_KEY: ""
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-fail-under=60

  build:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t nexagrid-backend ./backend
