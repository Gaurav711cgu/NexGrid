name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff bandit
      - name: Security scan (Bandit)
        run: bandit -r backend/app -ll -x backend/app/core/redis.py

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexagrid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r backend/requirements.txt pytest-asyncio pytest-cov
      - name: Init DB schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nexagrid_test -f backend/schema.sql
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexagrid_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-key-not-for-production
          ANTHROPIC_API_KEY: ""
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-fail-under=70

  build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t nexagrid-backend ./backend
