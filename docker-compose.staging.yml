version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexagrid-postgres-staging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging_db_secret_pass_2026}
      POSTGRES_DB: nexagrid_staging
    ports:
      - "5433:5432"
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexagrid-redis-staging
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexagrid-backend-staging
    environment:
      DATABASE_URL: postgresql://postgres:${STAGING_POSTGRES_PASSWORD:-staging_db_secret_pass_2026}@postgres:5432/nexagrid_staging
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-nexagrid-staging-secret-key-super-secure-2026}
      ENVIRONMENT: staging
      CORS_ALLOWED_ORIGINS: https://staging.nexgrid.dev
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_staging_data:
